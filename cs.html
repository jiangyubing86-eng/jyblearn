<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个页面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #fff;
      padding: 40px 50px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      color: #333;
      margin-bottom: 12px;
      font-size: 24px;
    }

    p {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    button {
      background: #667eea;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }

    button:hover {
      background: #5568d3;
    }

    button:active {
      transform: scale(0.97);
    }

    #count {
      display: inline-block;
      font-weight: bold;
      color: #764ba2;
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 你好，世界！</h1>
    <p>这是一个简单的 HTML 页面示例。</p>
    <button onclick="addCount()">点我一下</button>
    <p>你点击了 <span id="count">0</span> 次</p>
  </div>

  <script>
    let num = 0;

    function addCount() {
      num++;
      document.getElementById("count").textContent = num;
    }
  </script>
</body>
</html>
